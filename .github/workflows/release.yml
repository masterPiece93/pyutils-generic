# This workflow uploads pyutils_generic to PyPI when a GitHub Release is
# published. It uses PyPI trusted publishing (OIDC) — no long-lived tokens.
#
# Setup (one-time, on PyPI):
#   Register the project on PyPI and add a "Trusted Publisher" pointing to
#   this repo + this workflow file + the `pypi` environment.
#   See: https://docs.pypi.org/trusted-publishers/

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Gate: do not build or publish unless the full CI suite (lint + test matrix
  # + coverage) passes. Reuses tests.yml via `workflow_call`.
  tests:
    name: CI gate
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: write

  release-build:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build check-wheel-contents

      - name: Build distribution packages
        run: python -m build

      - name: Verify wheel contents
        run: check-wheel-contents dist/*.whl

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
      contents: read

    environment:
      name: pypi
      url: https://pypi.org/p/pyutils_generic

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # repository-url: https://test.pypi.org/legacy/  # used only for testpypi
          verbose: true
